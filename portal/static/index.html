<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INNOGREEN 统一门户</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/shell-top-actions.css">
  <link rel="stylesheet" href="/static/shell-sidebar.css">
  <style>
    :root {
      --mit-blue: #0b2b5b;          /* 对应 MIT 顶栏红，换成机构蓝 */
      --mit-blue-deep: #071e42;
      --accent: #0b5fff;            /* 链接/强调，对应 MIT 红链接 */
      --accent-soft: #e8f0ff;
      --ink: #111827;
      --muted: #5b6572;
      --line: #e5e7eb;
      --sidebar: #f4f5f7;
      --white: #ffffff;
      --font: "Source Sans 3", "Noto Sans SC", system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      color: var(--ink);
      background: var(--white);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ===== Top bar (MIT-style solid brand bar) ===== */
    .topbar {
      background: var(--mit-blue);
      color: #fff;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      text-decoration: none;
      flex-shrink: 0;
    }
    .brand:hover { text-decoration: none; opacity: 0.95; }

    .brand-logo-wrap {
      height: 52px;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
      flex-shrink: 0;
      line-height: 0;
      padding: 0 10px;
    }

    .brand-logo-wrap img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      border: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }
    .brand-text strong {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    /* top-nav 账户按钮样式：shell-top-actions.css */

    /* ===== Page shell: sidebar + main ===== */
    .page {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: calc(100vh - 72px);
    }

    /* 侧栏：shell-sidebar.css */

    /* ===== Main content: open & bright ===== */
    .main {
      padding: 40px 48px 64px;
      max-width: 1100px;
    }

    .hero {
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .hero-kicker {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .hero-row {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 16px;
    }

    .hero-logo {
      width: auto;
      height: 88px;
      max-width: 360px;
      border-radius: 8px;
      object-fit: contain;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(11, 43, 91, 0.12);
      background: #fff;
      padding: 0 8px;
    }

    .hero h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--mit-blue);
    }

    .hero p {
      font-size: 18px;
      line-height: 1.65;
      color: var(--muted);
      max-width: 42em;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-title h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--mit-blue);
    }
    .section-title span {
      font-size: 14px;
      color: var(--muted);
    }

    /* App tiles */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .app-card {
      --card-accent: var(--accent);
      --card-glow: rgba(11, 95, 255, 0.16);
      --card-soft: #e8f0ff;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      padding: 26px 24px 20px;
      background:
        radial-gradient(120% 80% at 100% 0%, var(--card-soft) 0%, transparent 55%),
        linear-gradient(165deg, #ffffff 0%, #f6f8fb 100%);
      border: 1px solid rgba(11, 43, 91, 0.08);
      border-radius: 18px;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 8px 24px rgba(11, 43, 91, 0.04);
      translate: 0 14px;
      opacity: 0;
      animation: appCardIn .55s cubic-bezier(.22,1,.36,1) forwards;
      animation-delay: calc(var(--i, 0) * 70ms);
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    .app-card[data-app="pmo"] {
      --card-accent: #0b5fff;
      --card-glow: rgba(11, 95, 255, 0.2);
      --card-soft: #e8f0ff;
    }
    .app-card[data-app="qcc"] {
      --card-accent: #0f766e;
      --card-glow: rgba(15, 118, 110, 0.2);
      --card-soft: #e6f7f5;
    }
    .app-card[data-app="sh_eia"] {
      --card-accent: #047857;
      --card-glow: rgba(4, 120, 87, 0.18);
      --card-soft: #e8f8f1;
    }

    .app-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--card-accent);
      opacity: 0.35;
      transition: opacity .25s, width .25s;
    }
    .app-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.55) 48%, transparent 62%);
      transform: translateX(-120%);
      transition: transform .6s ease;
      pointer-events: none;
      z-index: 1;
    }
    .app-card:hover {
      border-color: color-mix(in srgb, var(--card-accent) 35%, #c9d4e8);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 18px 40px rgba(11, 43, 91, 0.1),
        0 0 0 1px var(--card-glow);
      transform: translateY(-4px);
      text-decoration: none;
    }
    .app-card:hover::before { opacity: 1; width: 5px; }
    .app-card:hover::after { transform: translateX(120%); }

    .app-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      position: relative;
      z-index: 2;
    }

    .app-icon {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--card-accent) 12%, #fff);
      color: var(--card-accent);
      border-radius: 14px;
      border: 1px solid color-mix(in srgb, var(--card-accent) 18%, transparent);
      box-shadow: 0 8px 18px var(--card-glow);
      transition: transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s;
    }
    .app-card:hover .app-icon {
      transform: scale(1.08) rotate(-3deg);
      box-shadow: 0 12px 24px var(--card-glow);
    }
    .app-icon svg {
      width: 26px;
      height: 26px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--card-accent);
      background: color-mix(in srgb, var(--card-accent) 10%, #fff);
      border: 1px solid color-mix(in srgb, var(--card-accent) 16%, transparent);
      border-radius: 999px;
      padding: 5px 10px;
      line-height: 1;
    }

    .app-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--mit-blue);
      margin-bottom: 8px;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .app-desc {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
      flex: 1;
      position: relative;
      z-index: 2;
    }

    .app-foot {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid rgba(11, 43, 91, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      position: relative;
      z-index: 2;
    }
    .app-foot .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
      opacity: 0.85;
    }
    .app-foot .go {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--card-accent);
      font-weight: 700;
    }
    .app-foot .go svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .25s ease;
    }
    .app-card:hover .go svg { transform: translateX(4px); }

    /* 应景主题装饰（水印式插画，随色调 + 悬停微动） */
    .app-art {
      position: absolute;
      right: -12px;
      bottom: -16px;
      width: 138px;
      height: 138px;
      color: var(--card-accent);
      opacity: 0.1;
      z-index: 1;
      pointer-events: none;
      transition: opacity .3s ease, transform .45s cubic-bezier(.22,1,.36,1);
    }
    .app-art svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .app-card:hover .app-art {
      opacity: 0.2;
      transform: scale(1.08) rotate(-4deg);
    }

    @keyframes appCardIn {
      to { opacity: 1; translate: 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-card {
        animation: none;
        opacity: 1;
        translate: none;
      }
      .app-card::after { display: none; }
      .app-card:hover .app-icon,
      .app-card:hover .go svg { transform: none; }
    }

    /* Empty / login states */
    .panel {
      border: 1px solid var(--line);
      padding: 48px 36px;
      background: #fafbfc;
      max-width: 640px;
    }
    .panel h3 {
      font-size: 26px;
      color: var(--mit-blue);
      margin-bottom: 10px;
    }
    .panel p {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 22px;
    }
    .panel .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 20px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid var(--mit-blue);
      background: var(--mit-blue);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover { background: var(--mit-blue-deep); text-decoration: none; }
    .btn.secondary {
      background: #fff;
      color: var(--mit-blue);
    }
    .btn.secondary:hover { background: var(--accent-soft); }

    .loading {
      padding: 48px 0;
      color: var(--muted);
      font-size: 16px;
    }

    @media (max-width: 1100px) {
      .apps-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; }
      .main { padding: 28px 20px 48px; }
      .apps-grid { grid-template-columns: 1fr; }
      .topbar {
        padding: 0 12px 0 8px;
        height: 64px;
        gap: 10px;
        position: sticky;
        top: 0;
        z-index: 1200;
      }
      .brand { flex: 1; min-width: 0; }
      .brand-logo-wrap,
      .brand-logo-wrap img { height: 40px; max-width: 120px; }
      .brand-text strong { font-size: 16px; }
      .hero h1 { font-size: 26px; }
      .hero p { font-size: 15px; }
      .section-title h2 { font-size: 22px; }
    }
    @media (max-width: 720px) {
      /* 窄屏：隐藏 logo + 精简标题文字，给右上 nav 让出空间 */
      .topbar { height: 56px; padding: 0 10px; gap: 8px; }
      .brand-logo-wrap { display: none; }
      .brand-text strong { font-size: 15px; }
      .hero { margin-bottom: 28px; padding-bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="shell-sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <header class="topbar">
    <button type="button" class="shell-nav-toggle" id="nav-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="app-sidebar">
      <span class="shell-nav-toggle-bar"></span>
      <span class="shell-nav-toggle-bar"></span>
      <span class="shell-nav-toggle-bar"></span>
    </button>
    <a class="brand" href="/">
      <span class="brand-logo-wrap">
        <img src="/static/logo.jpg" alt="INNOGREEN">
      </span>
      <div class="brand-text">
        <strong>INNOGREEN 创新绿洲</strong>
      </div>
    </a>
    <nav class="top-nav shell-top-actions" id="top-nav" aria-label="账户操作"></nav>
  </header>

  <div class="page">
    <aside class="shell-sidebar" id="app-sidebar">
      <div class="shell-sidebar-brand">菜单</div>
      <div class="shell-sidebar-top">
        <div id="sidebar-user"></div>

        <div class="shell-sidebar-label">快捷入口</div>
        <ul class="shell-side-list" id="side-links">
          <li><a class="shell-side-link" href="/"><span class="shell-side-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg></span><span class="shell-side-body"><span class="shell-side-title">应用工作台</span></span></a></li>
        </ul>
      </div>

      <div class="shell-sidebar-bottom">
        <div class="shell-notice">
          <strong>统一身份</strong>
          一次登录，访问你被授权的全部 INNOGREEN 应用。权限由门户管理员统一配置。
        </div>

        <div class="shell-side-foot">
          上海国际化工新材料创新中心<br>
          Shanghai International Chemical New Materials Innovation Center
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="hero">
        <div class="hero-row">
          <h1>INNOGREEN 统一数字入口</h1>
        </div>
        <p>上海国际化工新材料创新中心（创新绿洲）聚焦先进材料、集成电路、生物制造等领域，以伙伴式陪伴助力入驻企业研发落地与合规发展。</p>
      </section>

      <div id="content">
        <div class="loading">正在加载…</div>
      </div>
    </main>
  </div>

  <script>
    const API = '';
    const roleLabel = { admin: '管理员', operator: '操作员', viewer: '访客' };
    const portalRoleLabel = { admin: '门户管理员', viewer: '访客' };

    const ICON_SVGS = {
      pmo: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16V9"/><path d="M12 16V7"/><path d="M16 16v-5"/><path d="M8 9h8"/></svg>`,
      qcc: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l8-4 8 4v12"/><path d="M9 20v-6h6v6"/><path d="M9 11h6"/></svg>`,
      sh_eia: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21c0-7 4-11 14-12 0 8-4 12-11 12H5z"/><path d="M5 21c1-4 3.5-6.5 7-8"/></svg>`,
      home: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>`,
      users: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.5"/><path d="M22 21v-2a3.5 3.5 0 0 0-2.5-3.35"/><path d="M16.5 3.6a3.5 3.5 0 0 1 0 6.8"/></svg>`,
      login: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17 15 12 10 7"/><path d="M15 12H3"/><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/></svg>`,
      register: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/><path d="M19 8v4"/><path d="M17 10h4"/></svg>`,
      docs: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>`,
      lab: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v7l-4.5 8.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.8-2.8L15 10V3"/><path d="M8 3h8"/><path d="M8.5 14h7"/></svg>`,
      flow: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.2 7.5 10.5 15"/><path d="M15.8 7.5 13.5 15"/></svg>`,
      data: `<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>`,
      shield: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v6c0 4.5 3 7.8 7 9 4-1.2 7-4.5 7-9V6l-7-3z"/><path d="m9 12 2 2 4-4"/></svg>`,
      spark: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m6 6 2.5 2.5"/><path d="M15.5 15.5 18 18"/><path d="m18 6-2.5 2.5"/><path d="M8.5 15.5 6 18"/><circle cx="12" cy="12" r="2.5"/></svg>`,
    };
    const ICON_FALLBACKS = ["docs", "lab", "flow", "data", "shield", "spark"];

    // 卡片右下角的应景主题装饰（大幅线条插画，半透明水印）
    const ART_SVGS = {
      pmo: `<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="16" y="72" width="16" height="30" rx="3"/><rect x="42" y="56" width="16" height="46" rx="3"/><rect x="68" y="40" width="16" height="62" rx="3"/><rect x="94" y="22" width="16" height="80" rx="3"/><path d="M20 62 46 46 74 32 104 14"/><path d="M104 14v14M104 14H90"/></svg>`,
      qcc: `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 10 102 26v30c0 28-19 48-42 58C37 104 18 84 18 56V26z"/><path d="M42 60 54 72 82 42"/></svg>`,
      sh_eia: `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M102 18C58 18 26 44 26 86c0 6 1 12 1 12s40-1 65-30c17-20 10-50 10-50z"/><path d="M40 100C56 74 76 52 98 40"/><path d="M12 104c8 2 14 2 22-2"/></svg>`,
      shield: `<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 10 102 26v30c0 28-19 48-42 58C37 104 18 84 18 56V26z"/><path d="M42 60 54 72 82 42"/></svg>`,
      data: `<svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="26" rx="38" ry="15"/><path d="M22 26v34c0 8 17 15 38 15s38-7 38-15V26"/><path d="M22 60v34c0 8 17 15 38 15s38-7 38-15V60"/></svg>`,
      flow: `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="28" cy="28" r="12"/><circle cx="92" cy="28" r="12"/><circle cx="60" cy="92" r="12"/><path d="M38 36 54 82"/><path d="M82 36 66 82"/></svg>`,
    };

    function appArtSvg(appCode) {
      const key = String(appCode || "").toLowerCase();
      if (ART_SVGS[key]) return ART_SVGS[key];
      const pool = ["data", "flow", "shield"];
      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = (hash + key.charCodeAt(i) * (i + 1)) % pool.length;
      return ART_SVGS[pool[hash]];
    }

    function appIconSvg(appCode) {
      const key = String(appCode || "").toLowerCase();
      if (ICON_SVGS[key]) return ICON_SVGS[key];
      let hash = 0;
      for (let i = 0; i < key.length; i++) hash = (hash + key.charCodeAt(i) * (i + 1)) % ICON_FALLBACKS.length;
      return ICON_SVGS[ICON_FALLBACKS[hash]];
    }

    function sideLink({ href, icon, title, sub, target }) {
      const tgt = target ? ` target="${target}" rel="noopener"` : '';
      const subHtml = sub ? `<em>${escapeHtml(sub)}</em>` : '';
      return `<li><a class="shell-side-link" href="${escapeHtml(href)}"${tgt}>
        <span class="shell-side-ico">${icon}</span>
        <span class="shell-side-body"><span class="shell-side-title">${escapeHtml(title)}</span>${subHtml}</span>
      </a></li>`;
    }

    const TOP_ICO = {
      key: `<span class="shell-top-btn-icon" aria-hidden="true"><svg viewBox="64 64 896 896" focusable="false"><path d="M608 112c-167.9 0-304 136.1-304 304 0 70.3 23.9 135 63.9 186.5L255.8 713.6l-62.3-62.3a8.19 8.19 0 00-11.4 0l-39.8 39.8a8.19 8.19 0 000 11.4l62.3 62.3-44.9 44.9-62.3-62.3a8.19 8.19 0 00-11.4 0l-39.8 39.8a8.19 8.19 0 000 11.4l110.3 111.2c3.1 3.1 8.2 3.1 11.3 0l253.6-253.6A304.1 304.1 0 00608 720c167.9 0 304-136.1 304-304S775.9 112 608 112m161.2 465.2C726.2 620.3 668.9 644 608 644s-118.2-23.7-161.2-66.8C403.7 534.2 380 476.9 380 416s23.7-118.2 66.8-161.2c43-43.1 100.3-66.8 161.2-66.8s118.2 23.7 161.2 66.8c43.1 43 66.8 100.3 66.8 161.2s-23.7 118.2-66.8 161.2"/></svg></span>`,
      logout: `<span class="shell-top-btn-icon" aria-hidden="true"><svg viewBox="64 64 896 896" focusable="false"><path d="M868 732h-70.3c-4.8 0-9.3 2.1-12.3 5.8-7 8.5-14.5 16.7-22.4 24.5a353.84 353.84 0 01-112.7 75.9A352.8 352.8 0 01512.4 866c-47.9 0-94.3-9.4-137.9-27.8a353.84 353.84 0 01-112.7-75.9 353.28 353.28 0 01-76-112.5C167.3 606.2 158 559.9 158 512s9.4-94.2 27.8-137.8c17.8-42.1 43.4-80 76-112.5s70.5-58.1 112.7-75.9c43.6-18.4 90-27.8 137.9-27.8 47.9 0 94.3 9.3 137.9 27.8 42.2 17.8 80.1 43.4 112.7 75.9 7.9 7.9 15.3 16.1 22.4 24.5 3 3.7 7.6 5.8 12.3 5.8H868c6.3 0 10.2-7 6.7-12.3C798 160.5 663.8 81.6 511.3 82 271.7 82.6 79.6 277.1 82 516.4 84.4 751.9 276.2 942 512.4 942c152.1 0 285.7-78.8 362.3-197.7 3.4-5.3-.4-12.3-6.7-12.3zm88.9-226.3L815 393.7c-5.3-4.2-13-.4-13 6.3v76H488c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h314v76c0 6.7 7.8 10.5 13 6.3l141.9-112a8 8 0 000-12.6z"/></svg></span>`,
    };

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function topNavLink(href, icon, label) {
      return `<a class="shell-top-btn" href="${escapeHtml(href)}">${TOP_ICO[icon] || ''}<span>${escapeHtml(label)}</span></a>`;
    }
    function topNavBtn(onclick, icon, label) {
      return `<button type="button" class="shell-top-btn" onclick="${onclick}">${TOP_ICO[icon] || ''}<span>${escapeHtml(label)}</span></button>`;
    }

    async function checkSession() {
      try {
        const r = await fetch(API + '/api/auth/me', { credentials: 'include' });
        if (r.ok) showApps(await r.json());
        else showLoginPrompt();
      } catch {
        showLoginPrompt();
      }
    }

    async function showApps(user) {
      let apps = [];
      try {
        const r = await fetch(API + '/api/apps/mine', { credentials: 'include' });
        if (r.ok) apps = await r.json();
      } catch {}

      document.getElementById('top-nav').innerHTML = [
        user.role === 'admin' ? topNavLink('/admin', 'key', '账号管理') : '',
        topNavBtn('logout()', 'logout', '退出'),
      ].join('');

      document.getElementById('sidebar-user').innerHTML = `
        <div class="shell-user-box">
          <div class="shell-user-box-name">${escapeHtml(user.display_name || user.username)}</div>
          <div class="shell-user-box-meta">${escapeHtml(portalRoleLabel[user.role] || user.role)} · @${escapeHtml(user.username)}</div>
        </div>
      `;

      const side = document.getElementById('side-links');
      side.innerHTML = [
        sideLink({ href: '/', icon: ICON_SVGS.home, title: '应用工作台', sub: '统一数字入口' }),
        user.role === 'admin'
          ? sideLink({ href: '/admin', icon: ICON_SVGS.users, title: '账号与授权', sub: '用户与应用权限' })
          : '',
        ...apps.map(a => sideLink({
          href: a.base_url,
          icon: appIconSvg(a.app_code),
          title: a.app_name,
          sub: a.description || a.app_code,
        })),
      ].join('');

      if (!apps.length) {
        document.getElementById('content').innerHTML = `
          <div class="section-title"><h2>应用中心</h2><span>0</span></div>
          <div class="panel">
            <h3>暂无可用应用</h3>
            <p>你已登录，但还没有应用授权。请联系门户管理员开通权限。</p>
          </div>
        `;
        return;
      }

      document.getElementById('content').innerHTML = `
        <div class="section-title">
          <h2>应用中心</h2>
          <span>共 ${apps.length} 项</span>
        </div>
        <div class="apps-grid">
          ${apps.map((app, i) => `
            <a class="app-card" data-app="${escapeHtml(String(app.app_code || '').toLowerCase())}" style="--i:${i}" href="${escapeHtml(app.base_url)}">
              <span class="app-art">${appArtSvg(app.app_code)}</span>
              <div class="app-top">
                <div class="app-icon">${appIconSvg(app.app_code)}</div>
                <span class="app-role">${escapeHtml(roleLabel[app.my_role] || app.my_role || '—')}</span>
              </div>
              <div class="app-name">${escapeHtml(app.description || app.app_code)}</div>
              <div class="app-desc">${escapeHtml(app.app_code)}</div>
              <div class="app-foot">
                <span class="code">${escapeHtml(app.app_code)}</span>
                <span class="go">进入应用<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></span>
              </div>
            </a>
          `).join('')}
        </div>
      `;
    }

    function showLoginPrompt() {
      document.getElementById('top-nav').innerHTML = `
        <a class="shell-top-btn" href="/register"><span>注册</span></a>
        <a class="shell-top-btn" href="/login"><span>登录</span></a>
      `;
      document.getElementById('sidebar-user').innerHTML = '';
      document.getElementById('side-links').innerHTML = [
        sideLink({ href: '/login', icon: ICON_SVGS.login, title: '登录', sub: '进入统一工作台' }),
        sideLink({ href: '/register', icon: ICON_SVGS.register, title: '申请账号', sub: '注册门户账号' }),
      ].join('');
      document.getElementById('content').innerHTML = `
        <div class="panel">
          <h3>请先登录</h3>
          <p>使用统一账号进入 INNOGREEN 工作台，访问已授权的全部应用。</p>
          <div class="actions">
            <a class="btn" href="/login">登录</a>
            <a class="btn secondary" href="/register">注册</a>
          </div>
        </div>
      `;
    }

    async function logout() {
      await fetch(API + '/api/auth/logout', { method: 'POST', credentials: 'include' });
      showLoginPrompt();
    }

    function openNavDrawer() {
      document.body.classList.add('shell-nav-open');
      const toggle = document.getElementById('nav-toggle');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (toggle) toggle.setAttribute('aria-expanded', 'true');
      if (backdrop) backdrop.hidden = false;
    }
    function closeNavDrawer() {
      document.body.classList.remove('shell-nav-open');
      const toggle = document.getElementById('nav-toggle');
      const backdrop = document.getElementById('sidebar-backdrop');
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
      if (backdrop) backdrop.hidden = true;
    }
    function toggleNavDrawer() {
      if (document.body.classList.contains('shell-nav-open')) closeNavDrawer();
      else openNavDrawer();
    }
    document.getElementById('nav-toggle')?.addEventListener('click', toggleNavDrawer);
    document.getElementById('sidebar-backdrop')?.addEventListener('click', closeNavDrawer);
    document.getElementById('side-links')?.addEventListener('click', (e) => {
      if (e.target.closest('a') && window.matchMedia('(max-width: 960px)').matches) closeNavDrawer();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeNavDrawer();
    });

    checkSession();
  </script>
</body>
</html>
