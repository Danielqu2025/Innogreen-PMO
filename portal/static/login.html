<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - INNOGREEN 统一门户</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mit-blue: #0b2b5b;
      --accent: #0b5fff;
      --ink: #111827;
      --muted: #5b6572;
      --line: #e5e7eb;
      --font: "Source Sans 3", "Noto Sans SC", system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font);
      color: var(--ink);
      min-height: 100vh;
      background: #f4f5f7;
    }
    .topbar {
      background: var(--mit-blue);
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
    }
    .brand-logo-wrap {
      height: 52px;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
      flex-shrink: 0;
      line-height: 0;
      padding: 0 10px;
    }
    .brand-logo-wrap img {
      height: 52px;
      width: auto;
      object-fit: contain;
      display: block;
      border: 0;
    }
    .brand strong {
      font-size: 26px;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .wrap {
      max-width: 440px;
      margin: 56px auto;
      padding: 0 20px 48px;
    }
    .login-box {
      background: #fff;
      border: 1px solid var(--line);
      padding: 40px 36px;
    }
    .login-box img.logo {
      width: auto;
      max-width: 100%;
      height: 56px;
      border-radius: 8px;
      object-fit: contain;
      display: block;
      margin-bottom: 18px;
    }
    .login-box h1 {
      font-size: 28px;
      color: var(--mit-blue);
      margin-bottom: 8px;
    }
    .login-box > p {
      color: var(--muted);
      margin-bottom: 28px;
      font-size: 15px;
      line-height: 1.5;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      font: inherit;
      font-size: 16px;
    }
    .form-group input:focus {
      outline: 2px solid rgba(11, 95, 255, 0.25);
      border-color: var(--accent);
    }
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: var(--mit-blue);
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .submit-btn:hover { background: #071e42; }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .error {
      color: #b91c1c;
      font-size: 14px;
      margin-bottom: 14px;
      min-height: 18px;
    }
    .links, .back-link { margin-top: 18px; text-align: center; font-size: 14px; }
    .links a, .back-link a { color: var(--accent); text-decoration: none; }
    .links a:hover, .back-link a:hover { text-decoration: underline; }
    .back-link a { color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-logo-wrap">
        <img src="/static/logo.jpg" alt="INNOGREEN">
      </span>
      <strong>INNOGREEN 创新绿洲</strong>
    </a>
  </header>

  <div class="wrap">
    <div class="login-box">
      <img class="logo" src="/static/logo.jpg" alt="INNOGREEN logo">
      <h1>登录</h1>
      <p>使用统一账号进入 INNOGREEN 工作台</p>

      <form method="post" action="/api/auth/login-form">
        <input type="hidden" name="next" value="/">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" name="username" required autofocus autocomplete="username">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="submit-btn">登录</button>
      </form>

      <div class="links"><a href="/register">还没有账号？注册</a></div>
      <div class="back-link"><a href="/">← 返回门户</a></div>
    </div>
  </div>

  <script>
    // 表单走浏览器原生 POST（action="/api/auth/login-form"），无需 JS。
    // 此处仅做表单提交时的 disabled 视觉反馈，避免重复点击。
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', () => {
        const btn = form.querySelector('button[type=submit]');
        if (btn) { btn.disabled = true; btn.textContent = '登录中...'; }
      });
    }
  </script>
</body>
</html>
