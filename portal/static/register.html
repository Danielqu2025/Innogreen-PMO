<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - INNOGREEN 统一门户</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .register-box {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .register-box h1 {
      color: #1e3a5f;
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .register-box > p {
      color: #666;
      text-align: center;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: #333;
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .form-group .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }
    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error {
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
      min-height: 20px;
    }
    .success {
      color: #16a34a;
      font-size: 14px;
      margin-bottom: 16px;
      text-align: center;
    }
    .links {
      text-align: center;
      margin-top: 20px;
    }
    .links a {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .back-link {
      text-align: center;
      margin-top: 16px;
    }
    .back-link a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h1>INNOGREEN 统一门户</h1>
    <p>创建统一账号，访问所有应用</p>

    <div class="error" id="error"></div>
    <div class="success" id="success" style="display:none"></div>

    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" name="username" required minlength="2" autofocus>
      </div>
      <div class="form-group">
        <label>显示名称</label>
        <input type="text" name="display_name" placeholder="选填，如姓名">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" name="password" required minlength="8">
        <div class="hint">至少 8 位</div>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">注册</button>
    </form>

    <div class="links">
      <a href="/login">已有账号？登录</a>
    </div>
    <div class="back-link">
      <a href="/">← 返回门户</a>
    </div>
  </div>

  <script>
    const API = '';

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const form = e.target;

      btn.disabled = true;
      btn.textContent = '注册中...';
      errorEl.textContent = '';
      successEl.style.display = 'none';

      try {
        const r = await fetch(API + '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: form.username.value,
            display_name: form.display_name.value || undefined,
            password: form.password.value,
          }),
        });

        const data = await r.json();

        if (r.ok) {
          successEl.textContent = '注册成功！即将跳转到登录页...';
          form.style.display = 'none';
          setTimeout(() => window.location.href = '/login', 1500);
        } else {
          errorEl.textContent = data.detail?.message || '注册失败';
        }
      } catch (err) {
        errorEl.textContent = '网络错误，请重试';
      } finally {
        btn.disabled = false;
        btn.textContent = '注册';
      }
    }
  </script>
</body>
</html>
