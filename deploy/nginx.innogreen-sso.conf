# =============================================================================
# Innogreen 统一入口（同域路径路由 + SSO cookie）
#
# 公网示例（Cloudflare Tunnel → 本机 nginx）：
#   https://innogreen.example.com/        → Portal  (127.0.0.1:8001)
#   https://innogreen.example.com/pmo/    → PMO     (127.0.0.1:8000)
#   https://innogreen.example.com/qcc/    → qcc     (127.0.0.1:8765)
#   https://innogreen.example.com/eia/    → sh_eia  (127.0.0.1:8080)
#
# 共享会话 cookie（四端须一致）：
#   Name=innogreen_session  Path=/  Secure  SameSite=Lax
#   Domain 留空（同 host 路径共享）
#
# 部署：
#   sudo cp deploy/nginx.innogreen-sso.conf /etc/nginx/sites-available/innogreen.conf
#   sudo ln -sf /etc/nginx/sites-available/innogreen.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   Tunnel 指到 http://127.0.0.1:8788
# =============================================================================

upstream portal_upstream { server 127.0.0.1:8001; }
upstream pmo_upstream    { server 127.0.0.1:8000; }
upstream qcc_upstream    { server 127.0.0.1:8765; }
upstream eia_upstream    { server 127.0.0.1:8080; }

server {
    listen 127.0.0.1:8788;
    server_name _;

    client_max_body_size 32m;

    # ---- PMO：浏览器 /pmo/* → 后端 /*（须写在 location / 之前，前缀更长优先）----
    location /pmo/ {
        proxy_pass http://pmo_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /pmo;
        proxy_read_timeout 120s;
    }
    location = /pmo { return 301 /pmo/; }

    # ---- qcc SSE（关 buffering）----
    location = /qcc/api/companies/batch-sync/stream {
        proxy_pass http://qcc_upstream/api/companies/batch-sync/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /qcc;
    }

    # ---- qcc：浏览器 /qcc/* → 后端 /* ----
    location /qcc/ {
        proxy_pass http://qcc_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /qcc;
        proxy_read_timeout 120s;
    }
    location = /qcc { return 301 /qcc/; }

    # ---- sh_eia：浏览器 /eia/* → 后端 /*（同步/下载可能较久）----
    location /eia/ {
        proxy_pass http://eia_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix /eia;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 128m;
    }
    location = /eia { return 301 /eia/; }

    # ---- Portal：根路径（含 /api/auth /api/apps /login /register）----
    location / {
        proxy_pass http://portal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
